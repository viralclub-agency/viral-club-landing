# Configurazione Netlify: pubblica la cartella "sito" e la funzione che manda le lead su Telegram
[build]
  publish = "sito"
  functions = "netlify/functions"

# La pagina chiama /api/lead (così funziona anche su Vercel): su Netlify la giriamo alla funzione
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true
